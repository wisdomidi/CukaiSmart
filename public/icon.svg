<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />
  
  <!-- Central Shield -->
  <path d="M256 96 L376 144 C376 272 256 368 256 392 C256 368 136 272 136 144 Z" fill="url(#shieldGrad)" stroke="#34d399" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Chip Lines / Tech nodes -->
  <path d="M256 160 L256 220 M200 220 L312 220 M180 270 L332 270 M256 270 L256 340" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" />
  <circle cx="200" cy="220" r="7" fill="#fbbf24" />
  <circle cx="312" cy="220" r="7" fill="#fbbf24" />
  <circle cx="180" cy="270" r="7" fill="#fbbf24" />
  <circle cx="332" cy="270" r="7" fill="#fbbf24" />
  <circle cx="256" cy="340" r="7" fill="#34d399" />
  <circle cx="256" cy="160" r="7" fill="#34d399" />
  
  <!-- Center RM Emblem -->
  <rect x="216" y="216" width="80" height="80" rx="18" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="4" />
  <text x="256" y="266" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#fbbf24" text-anchor="middle" letter-spacing="-1">RM</text>
  
  <!-- Sparkles -->
  <path d="M370 120 L378 132 L390 140 L378 148 L370 160 L362 148 L350 140 L362 132 Z" fill="#fde047" />
  <path d="M140 330 L145 338 L154 343 L145 348 L140 356 L135 348 L126 343 L135 338 Z" fill="#6ee7b7" />
</svg>
