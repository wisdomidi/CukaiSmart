    <script>
      // Suppress and neutralize Vite HMR WebSocket connection errors in dev preview iframe environment
      (function() {
        if (typeof window !== 'undefined') {
          if (window.WebSocket) {
            var OriginalWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var isViteHmr = (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
                              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/client') !== -1));
              if (isViteHmr) {
                var dummy = new EventTarget();
                dummy.send = function() {};
                dummy.close = function() {};
                dummy.readyState = 1;
                dummy.url = url;
                dummy.protocol = 'vite-hmr';
                dummy.extensions = '';
                dummy.bufferedAmount = 0;
                dummy.binaryType = 'blob';
                return dummy;
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
            window.WebSocket.OPEN = OriginalWebSocket.OPEN;
            window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
            window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
          }

          var origError = console.error;
          console.error = function() {
            var msg = Array.prototype.slice.call(arguments).map(function(a) {
              return (a && a.message) || String(a);
            }).join(' ');
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1) {
              return;
            }
            return origError.apply(console, arguments);
          };

          var origWarn = console.warn;
          console.warn = function() {
            var msg = Array.prototype.slice.call(arguments).map(function(a) {
              return (a && a.message) || String(a);
            }).join(' ');
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1) {
              return;
            }
            return origWarn.apply(console, arguments);
          };

          window.addEventListener('error', function(e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || '';
            var file = (e && e.filename) || '';
            if (msg.indexOf('WebSocket') !== -1 || file.indexOf('@vite/client') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
            if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('@vite/client') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
